name: Infragr.am Terraform diagrams
description: Build a Terraform plan, remove secrets locally, independently scan it, and request architecture diagrams.
author: Tekchbila Studios

branding:
  icon: share-2
  color: purple

inputs:
  working-directory:
    description: Terraform root module directory.
    required: false
    default: .
  plan-path:
    description: Existing binary Terraform plan. When set, init and plan are skipped.
    required: false
  var-files:
    description: Ordered newline-separated tfvars files. Later files override earlier files.
    required: false
  environment:
    description: >-
      Names this build when one repository produces several per pull request,
      for example "staging" and "production" planning the same root against
      different tfvars. Runs supersede each other within an environment and
      never across, so sibling builds do not cancel one another.
    required: false
  vars:
    description: >-
      Newline-separated key=value Terraform input overrides, passed as -var.
      Never secrets: these are visible in the workflow file and in plan output.
      Use TF_VAR_* environment variables backed by GitHub secrets for those.
    required: false
  terraform-args:
    description: Additional non-secret terraform plan arguments.
    required: false
  secret-scan:
    description: >-
      Gitleaks behaviour on the sanitized bundle. "block" fails the run and
      uploads nothing when a potential secret is flagged, "warn" annotates the
      run and uploads anyway, "off" skips the scan entirely. Collector
      sanitization runs in every mode; this only governs the independent second
      pass over the serialized bundle.
    required: false
    default: block
  api-url:
    description: Infragr.am API base URL.
    required: false
    default: https://infragr.am

outputs:
  run-id:
    description: Infragr.am build identifier.
    value: ${{ steps.run.outputs.run-id }}
  run-url:
    description: Infragr.am build URL.
    value: ${{ steps.run.outputs.run-url }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PLAN_PATH: ${{ inputs.plan-path }}
        INPUT_VAR_FILES: ${{ inputs.var-files }}
        INPUT_VARS: ${{ inputs.vars }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_TERRAFORM_ARGS: ${{ inputs.terraform-args }}
        INPUT_SECRET_SCAN: ${{ inputs.secret-scan }}
        INPUT_API_URL: ${{ inputs.api-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"
